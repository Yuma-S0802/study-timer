<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b2b" />
    <title>UMA.Lab | 学習タイマー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Focus Flow の先頭へ">
          <span class="brand-mark">◌</span>
          <span>UMA.Lab</span>
        </a>
        <button id="openSettings" class="icon-button" type="button" aria-label="テーマ設定を開く">
          <span aria-hidden="true">⚙</span>
        </button>
      </header>

      <section class="focus-panel" aria-labelledby="pageTitle">
        <div class="intro">
          <p class="eyebrow">MULT STUDY TIMER</p>
          <h1 id="pageTitle">もう一歩。</h1>
          <p class="subtitle">「あと一秒」を積み重ねよう。</p>
        </div>

        <nav class="mode-tabs" aria-label="計測モード">
          <button class="mode-tab is-active" type="button" data-mode="timer">タイマー</button>
          <button class="mode-tab" type="button" data-mode="stopwatch">ストップウォッチ</button>
          <button class="mode-tab" type="button" data-mode="pomodoro">ポモドーロ</button>
        </nav>

        <section class="timer-stage" aria-live="polite">
          <p id="phaseLabel" class="phase-label">設定した時間</p>
          <output id="timeDisplay" class="time-display" aria-label="残り時間">25:00</output>
          <p id="progressLabel" class="progress-label">準備ができたら開始してください</p>
        </section>

        <section id="timerSetup" class="setup-panel" aria-label="タイマー時間の設定">
          <label>
            <span>時間</span>
            <input id="timerHours" type="number" inputmode="numeric" min="0" max="23" value="0" />
          </label>
          <span class="unit">:</span>
          <label>
            <span>分</span>
            <input id="timerMinutes" type="number" inputmode="numeric" min="0" max="59" value="25" />
          </label>
          <span class="unit">:</span>
          <label>
            <span>秒</span>
            <input id="timerSeconds" type="number" inputmode="numeric" min="0" max="59" value="0" />
          </label>
        </section>

        <section id="pomodoroSetup" class="setup-panel pomodoro-setup is-hidden" aria-label="ポモドーロ設定">
          <div class="pomodoro-rule">
            <span class="rule-number">30</span><span>分 作業</span>
            <span class="rule-separator">＋</span>
            <span class="rule-number">5</span><span>分 休憩</span>
          </div>
          <label class="set-count">
            <span>繰り返すセット数</span>
            <input id="pomodoroSets" type="number" inputmode="numeric" min="1" max="12" value="4" />
            <span>セット</span>
          </label>
        </section>

        <div class="controls">
          <button id="startButton" class="primary-button" type="button">開始する</button>
          <button id="pauseButton" class="secondary-button" type="button" disabled>一時停止</button>
          <button id="resetButton" class="text-button" type="button">リセット</button>
        </div>

        <p id="statusMessage" class="status-message" role="status">現在のテーマ：Ocean</p>
      </section>

      <footer class="page-footer">
        <span id="themeCaption">Ocean — 波音環境</span>
        <span class="footer-dot" aria-hidden="true">•</span>
        <button id="footerSettings" class="footer-link" type="button">テーマを変更</button>
      </footer>
    </main>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <form id="settingsForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">FOCUS THEMA</p>
            <h2 id="settingsTitle">集中テーマ</h2>
          </div>
          <button id="closeSettings" class="icon-button" type="button" aria-label="設定を閉じる">×</button>
        </div>

        <p class="dialog-description">画面の配色と、作業BGMを選択。</p>
        <fieldset class="theme-list">
          <legend>テーマを選択</legend>
          <label class="theme-card" data-theme-card="ocean">
            <input type="radio" name="theme" value="ocean" checked />
            <span class="theme-preview ocean-preview" aria-hidden="true"></span>
            <span><strong>Ocean</strong><small>紺碧 ＋ 波音</small></span>
          </label>
          <label class="theme-card" data-theme-card="fire">
            <input type="radio" name="theme" value="fire" />
            <span class="theme-preview fire-preview" aria-hidden="true"></span>
            <span><strong>Campfire</strong><small>ダークレッド ＋ 焚火</small></span>
          </label>
          <label class="theme-card" data-theme-card="forest">
            <input type="radio" name="theme" value="forest" />
            <span class="theme-preview forest-preview" aria-hidden="true"></span>
            <span><strong>Forest</strong><small>深緑 ＋ 雨音</small></span>
          </label>
        </fieldset>

        <label class="volume-control">
          <span>音量</span>
          <input id="volumeControl" type="range" min="0" max="100" value="35" />
          <output id="volumeValue">35%</output>
        </label>
        <div class="dialog-actions">
          <button class="primary-button" type="submit">保存する</button>
        </div>
      </form>
    </dialog>

    <div id="completionToast" class="completion-toast" role="alert" aria-live="assertive"></div>
    <audio id="themeAudio" loop preload="auto"></audio>
    <script src="app.js"></script>
  </body>
</html>
